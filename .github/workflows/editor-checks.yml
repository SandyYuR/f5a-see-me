name: Editor checks
on:
  push:
    branches: [site]
  pull_request:
    branches: [site]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
        with:
          path: editor
      - uses: actions/checkout@v7
        with:
          repository: SandyYuR/fcitx5-android
          ref: fx-rime-only
          path: app-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Test data and editor behavior
        env:
          FXR_ASSETS: ${{ github.workspace }}/app-source/app/src/main/assets/bundled
        run: node --test tests/*.test.cjs
      - name: Install the browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check real browser interactions and preview geometry
        env:
          F5A_SHOTS: artifacts
        run: python tests/workspace-browser.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-browser-evidence
          path: editor/artifacts/
